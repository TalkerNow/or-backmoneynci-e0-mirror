services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: optionret_php82
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "9008:9000"
    environment:
      PHP_MEMORY_LIMIT: 512M
      PHP_MAX_EXECUTION_TIME: 120
    extra_hosts:
      - "host.docker.internal:host-gateway"   # <— AJOUT
    restart: unless-stopped

