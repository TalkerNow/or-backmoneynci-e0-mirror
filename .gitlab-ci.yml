# Déploiement automatique sur la VPS de test à chaque push/merge sur dev.
# Voir docs/superpowers/specs/2026-05-05-cicd-dev-vps-test-design.md
stages:
  - deploy

deploy_test:
  stage: deploy
  image: alpine:3.19
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    # DEBUG: inspect the key file (size + first 30 bytes shape, not content)
    - echo "Key file path: $SSH_PRIVATE_KEY"
    - ls -la "$SSH_PRIVATE_KEY" || true
    - wc -c < "$SSH_PRIVATE_KEY" | xargs -I {} echo "byte count = {}"
    - head -c 30 "$SSH_PRIVATE_KEY" | od -c | head -3
    - echo "Last 30 bytes:"
    - tail -c 30 "$SSH_PRIVATE_KEY" | od -c | head -3
    # Normalize key: strip CR, ensure trailing newline
    - (cat "$SSH_PRIVATE_KEY"; echo) | tr -d '\r' > /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - tr -d '\r' < "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - ssh -p 5096 debian@vps-a1b847f6.vps.ovh.net "true"
  timeout: 30m
