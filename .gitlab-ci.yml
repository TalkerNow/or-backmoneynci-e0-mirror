# Déploiement automatique sur la VPS de test à chaque push/merge sur dev.
# Voir docs/superpowers/specs/2026-05-05-cicd-dev-vps-test-design.md
stages:
  - deploy

deploy_test:
  stage: deploy
  image: alpine:3.19
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    # Normalize key (strip CR, ensure trailing newline) — workaround for GitLab File var copy-paste artifacts
    - (cat "$SSH_PRIVATE_KEY"; echo) | tr -d '\r' > /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Pinned host keys (not secrets — captured via ssh-keyscan)
    - |
      cat > ~/.ssh/known_hosts <<'EOF'
      [vps-a1b847f6.vps.ovh.net]:5096 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICyTkgI+b7OLG6EG09zk1F0Mk9sZpFU225RypKqqxkFk
      [vps-a1b847f6.vps.ovh.net]:5096 ssh-rsa 
      [vps-a1b847f6.vps.ovh.net]:5096 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKVYsa3iJRyAu1j5pNDtSz0tr0NfRFsHX/tnTK8Q+vpXOeg/5mhOD7RSSDWeraekGCoKLo9DyRgshKKLSArKpx4=
      EOF
  script:
    - ssh -p 5096 debian@vps-a1b847f6.vps.ovh.net "true"
  timeout: 30m
