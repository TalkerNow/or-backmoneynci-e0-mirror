# Déploiement automatique sur la VPS de test à chaque push/merge sur dev.
# Voir docs/superpowers/specs/2026-05-05-cicd-dev-vps-test-design.md
stages:
  - deploy

deploy_test:
  stage: deploy
  image: alpine:3.19
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    # Normalize key: strip CR, ensure trailing newline (workaround for GitLab File variable copy-paste artifacts)
    - (cat "$SSH_PRIVATE_KEY"; echo) | tr -d '\r' > /tmp/ssh_key
    - chmod 600 /tmp/ssh_key
    - ssh-add /tmp/ssh_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - tr -d '\r' < "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - ssh -p 5096 debian@vps-a1b847f6.vps.ovh.net "true"
  timeout: 30m
